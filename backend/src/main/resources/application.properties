spring.application.name=demo
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:}
# For security, set DB_PASSWORD as an environment variable. Never hardcode credentials in source files. See OWASP A3:2017 Sensitive Data Exposure.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
# WARNING: Disable H2 console in production! (spring.h2.console.enabled=false)
spring.jpa.hibernate.ddl-auto=none
server.port=9090
# For production, use HTTPS and configure secure headers (see OWASP Secure Headers Project)